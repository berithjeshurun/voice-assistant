repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(amy|tests|scripts)/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=1024]
  - repo: local
    hooks:
      - id: no-env-files
        name: never commit .env / secrets
        entry: secret-looking files must not be committed
        language: fail
        files: (^|/)(\.env(\..*)?|.*secrets?\.(json|ya?ml|env))$
        exclude: (\.example$|^amy/apps/secrets\.py$|^amy/settings/)
