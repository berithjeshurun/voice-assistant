[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amy"
version = "0.1.0"
description = "Amy — always-on voice assistant host (PyHive brain, HUD + LAN server)"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: Microsoft :: Windows",
]
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "websockets>=12,<16",
  "pydantic>=2.5,<3",
  "PyYAML>=6,<7",
  "pynput>=1.7; sys_platform == 'win32'",
  "pycaw>=20240210; sys_platform == 'win32'",
  "comtypes>=1.4; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML",
  "pre-commit>=3",
]
apps = ["playwright>=1.40"]
tls = ["cryptography>=42"]

[project.scripts]
amy = "amy.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["amy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:anyio"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["apps", "scripts/_smoke_*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S110", "BLE", "RUF100"]
ignore = [
  "E501",   # long strings in prompts / messages
  "B008",   # FastAPI Depends() defaults
  "UP006",  # typing.List etc. — avoid churn across upstream-owned modules
  "UP035",
  "UP007",  # Optional[...] is fine
  "UP042",
  "UP045",
  "BLE001", # broad except is allowed when it is logged
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S110", "B011"]
"scripts/*" = ["S110"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
files = [
  "amy/guard",
  "amy/server",
  "amy/protocol",
  "amy/storage",
  "amy/errors.py",
  "amy/logs.py",
  "amy/doctor.py",
  "amy/hive_adapter.py",
  "amy/host/ambient.py",
  "amy/host/events.py",
  "amy/host/turns.py",
  "amy/host/conversation.py",
  "amy/host/speak_pulse.py",
  "amy/host/voice_events.py",
  "amy/host/voice_setup.py",
  "amy/host/background.py",
  "amy/host/tool_surface.py",
  "amy/host/browsers.py",
  "scripts/gen_protocol_ts.py",
]
