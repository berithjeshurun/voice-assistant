<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amy</title>
    <style>
      :root {
        font-family: "Segoe UI", system-ui, sans-serif;
        color: #e7f0f7;
        background: #071018;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(165deg, #071018, #0d1c28);
      }
      main {
        max-width: 28rem;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        font-size: 2.8rem;
        margin: 0 0 0.5rem;
        letter-spacing: -0.04em;
      }
      p {
        color: #8aa3b5;
        line-height: 1.5;
      }
      .links {
        display: flex;
        gap: 0.6rem;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 1.1rem;
      }
      a {
        display: inline-block;
        padding: 0.7rem 1.1rem;
        border-radius: 0.75rem;
        background: #e8a24a;
        color: #1a1208;
        font-weight: 600;
        text-decoration: none;
      }
      a.secondary {
        background: transparent;
        color: #e7f0f7;
        border: 1px solid rgba(232, 162, 74, 0.35);
      }
      code {
        font-size: 0.85rem;
        color: #4db8e8;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Amy</h1>
      <p>
        Desktop shell. Start the host with <code>.\scripts\run.ps1</code>, then open
        captions chat or the orb.
      </p>
      <div class="links">
        <a id="chat" href="http://127.0.0.1:8787/?view=chat">Captions chat</a>
        <a id="orb" class="secondary" href="http://127.0.0.1:8787/?view=orb">Orb</a>
      </div>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const token = params.get("token") || localStorage.getItem("amy_token") || "";
      const q = token ? "&token=" + encodeURIComponent(token) : "";
      if (token) localStorage.setItem("amy_token", token);
      document.getElementById("chat").href = "http://127.0.0.1:8787/?view=chat" + (token ? "&token=" + encodeURIComponent(token) : "");
      document.getElementById("orb").href = "http://127.0.0.1:8787/?view=orb" + (token ? "&token=" + encodeURIComponent(token) : "");
      // Auto-jump to captions when launched with a token / AMY_CHAT_URL flow
      if (params.get("autochat") === "1" || params.get("view") === "chat") {
        location.replace(document.getElementById("chat").href);
      }
    </script>
  </body>
</html>
