<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amy</title>
    <style>
      :root {
        font-family: "Segoe UI", system-ui, sans-serif;
        color: #e7f0f7;
        background: #071018;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(165deg, #071018, #0d1c28);
      }
      main {
        max-width: 28rem;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        font-size: 2.8rem;
        margin: 0 0 0.5rem;
        letter-spacing: -0.04em;
      }
      p {
        color: #8aa3b5;
        line-height: 1.5;
      }
      .links {
        display: flex;
        gap: 0.6rem;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 1.1rem;
      }
      a {
        display: inline-block;
        padding: 0.7rem 1.1rem;
        border-radius: 0.75rem;
        background: #e8a24a;
        color: #1a1208;
        font-weight: 600;
        text-decoration: none;
      }
      a.secondary {
        background: transparent;
        color: #e7f0f7;
        border: 1px solid rgba(232, 162, 74, 0.35);
      }
      code {
        font-size: 0.85rem;
        color: #4db8e8;
      }
      .hint {
        margin-top: 1.25rem;
        font-size: 0.85rem;
        color: #6a8496;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Amy</h1>
      <p>
        Launcher. Start the host with <code>scripts/run.ps1</code> or
        <code>scripts/run.sh</code>, then open the HUD when you need it.
        The orb stays always-on-top from the host.
      </p>
      <div class="links">
        <a id="hud" href="http://127.0.0.1:8787/">Open Amy HUD</a>
        <a id="orb" class="secondary" href="http://127.0.0.1:8787/?view=orb">Orb</a>
      </div>
      <p class="hint">Tray: Open Amy HUD · Open orb · Quit</p>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const token = params.get("token") || localStorage.getItem("amy_token") || "";
      if (token) localStorage.setItem("amy_token", token);
      const q = token ? "?token=" + encodeURIComponent(token) : "";
      const qOrb = token
        ? "?view=orb&token=" + encodeURIComponent(token)
        : "?view=orb";
      document.getElementById("hud").href = "http://127.0.0.1:8787/" + q;
      document.getElementById("orb").href = "http://127.0.0.1:8787/" + qOrb;
    </script>
  </body>
</html>
